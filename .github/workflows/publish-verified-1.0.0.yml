name: Publish verified v1.0.0

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-feishuwake-v1.0.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Kok1Ne/feishu-wake' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out publication instructions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify existing cloud artifact and publish exact signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release/publish_verified_1_0_0.py
