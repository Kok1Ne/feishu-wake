name: Android 11 acceptance (not release)

# Standard public-repository runner only. No release/signing in this workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'testtarget/**'
      - 'tools/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android11-core.yml'
      - 'research/feishu_download_probe.py'

permissions:
  contents: read

concurrency:
  group: android11-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out this source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare logs and require KVM
        run: |
          mkdir -p reports/ci
          git rev-parse HEAD > reports/ci/source-commit.txt
          uname -a > reports/ci/host.txt
          test -c /dev/kvm
          # Restrict the permission change to this disposable runner's KVM device.
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chgrp "$(id -gn)" /dev/kvm
            sudo chmod g+rw /dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm >> reports/ci/host.txt
      - name: Set up Android command-line tools on the cloud runner
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Free unused packages on the disposable cloud runner
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$ANDROID_HOME" = /usr/local/lib/android/sdk
          df -h . | tee reports/ci/disk-before.txt
          # Kotlin/Java build: preinstalled NDK/CMake are unused. These are cloud paths.
          for unused in "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"; do
            if [ -d "$unused" ]; then
              du -sh "$unused" | tee -a reports/ci/disk-before.txt
              rm -rf -- "$unused"
            fi
          done
          df -h . | tee reports/ci/disk-after.txt
      - name: Install compile SDKs
        run: |
          sdkmanager 'platforms;android-30' 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 2>&1 | tee reports/ci/sdk-install.log
      - name: Check cloud Python entry points
        run: |
          python3 -m py_compile tools/*.py research/*.py release/*.py
          node --check signing/vault.mjs
      - name: Compile internal test packages and run JVM tests and lint
        run: |
          bash ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :testtarget:assembleDebug 2>&1 | tee reports/ci/gradle.log
      - name: Fetch and verify the official Feishu APK on this runner
        env:
          FEISHU_KEEP_PACKAGE: '1'
        run: python3 research/feishu_download_probe.py 2>&1 | tee reports/ci/feishu-package.log
      - name: Boot API 30 and run real Feishu acceptance then fixture control
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          emulator-port: 5554
          emulator-boot-timeout: 300
          disable-linux-hw-accel: 'false'
          disable-animations: 'false'
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim -accel on
          script: |
            FEISHU_PROBE_TARGET=feishu FEISHU_PROBE_EXTENDED=1 python3 tools/ci_android11.py
            python3 tools/ci_android11.py
      - name: Save logs and test reports only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android11-core-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            reports/ci/
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
