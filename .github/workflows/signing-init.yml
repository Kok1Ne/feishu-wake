name: Verify fixed signing key (no APK)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify the privately stored fixed key
        env:
          FEISHU_SIGNING_PASSWORD: ${{ secrets.FEISHU_SIGNING_PASSWORD }}
          FEISHU_SIGNING_VAULT: ${{ secrets.FEISHU_SIGNING_VAULT }}
        run: node signing/vault.mjs restore
